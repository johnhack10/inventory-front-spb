<h2 mat-dialog-title> {{ formStatus }} Producto</h2>
<mat-dialog-content>
  <form [formGroup]="productForm">
    <div class="product-container">
      <mat-form-field>
        <input matInput placeholder="Nombre" formControlName="name" required />
      </mat-form-field>

      <mat-form-field>
        <input matInput type="number" placeholder="Precio" formControlName="price" required />
      </mat-form-field>

      <mat-form-field>
        <input matInput type="number" placeholder="Cantidad" formControlName="quantity" required />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Categoría</mat-label>
        <mat-select formControlName="category" required>
          <mat-option *ngFor="let cat of categories" [value]="cat.id">
            {{ cat.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div>
        <mat-label>Foto:</mat-label>
        <div class="upload">
          <label for="file-upload">
              Subir archivo
          </label>
          <mat-icon>cloud_upload</mat-icon>
        </div>
        <input type="file" id="file-upload" (change)="onFileSelected($event)" accept="image/png, image/jpeg" formControlName="picture" class="input-file" />
        <span>{{ nameImage }}</span>
      </div>

    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button color="primary" (click)="onSave()" [disabled]="productForm.invalid">
    <mat-icon>save</mat-icon> Guardar
  </button>
  <button mat-button color="primary" (click)="onCancel()">
    <mat-icon>cancel</mat-icon> Cancelar
  </button>
</mat-dialog-actions>
